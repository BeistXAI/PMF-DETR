model:
  num_classes: 1
  input_channels: 3
  hidden_dim: 256
  num_queries: 300
  num_decoder_layers: 3
  num_heads: 8
  num_points: 4
  dim_feedforward: 1024
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  eval_idx: -1
  meea: true
  sadca: true
  mbconv: true
  meea_dilations:
  - 1
  - 2
  - 5
  meea_sigma: 1.0
  meea_wavelength: 2.0
  meea_gamma: 0.5
  sadca_kernel_size: 3
  sadca_reduction: 16
  sadca_spatial_kernel: 7
  mbconv_kernel_size: 5
  mbconv_branch_ratio: 0.25
  mbconv_diagonal_scale: 2.0
  fpn_depth: 3
loss:
  box_loss: focaler_giou
  focaler_lower: 0.0
  focaler_upper: 0.95
  nwd_weight: 0.0
  nwd_constant: 12.8
  class_weight: 1.0
  bbox_weight: 5.0
  giou_weight: 2.0
train:
  epochs: 300
  batch_size: 4
  imgsz: 640
  workers: 4
  lr: 0.0001
  backbone_lr: 1.0e-05
  weight_decay: 0.0001
  clip_grad_norm: 0.1
  warmup_epochs: 3
  min_lr_ratio: 0.01
  hflip: 0.5
  seed: 42
  amp: false
eval:
  score_threshold: 0.001
  conf: 0.25
  max_dets: 300
