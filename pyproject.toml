[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmf-detr"
version = "0.1.0"
description = "Pediatric mandible fracture detection with a method-equation PMF-DETR implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.5.1,<2.6",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "Pillow>=10.0,<13",
  "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["pmf_detr*"]

